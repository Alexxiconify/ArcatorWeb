<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Forums - Arcator</title>
    <link href="./master.css" rel="stylesheet">
    <link href="./forums.css" rel="stylesheet">
    <link href="./favicon.png" rel="icon" type="image/png">
</head>
<body class="bg-surface text-text">
<div id="navbar-placeholder"></div>

<section class="hero-banner">
    <img alt="Hero" class="hero-image" src="./creativespawn.png">
    <div class="hero-overlay"></div>
    <div class="hero-content">
        <h1>Forums & Messages</h1>
        <p>Community discussions and conversations</p>
    </div>
</section>

<main class="container mx-auto px-4 py-8" style="padding-bottom: calc(var(--footer-height) + 1rem); flex: 1 0 auto; min-height: 0; max-width: 1000px;">
    <div class="tabs">
        <button class="tab-btn active" id="forums-tab-btn">Forums</button>
        <button class="tab-btn" id="messages-tab-btn">Messages</button>
    </div>

    <!-- Forums Tab -->
    <div class="tab-content active" id="forums-tab">
        <div class="mb-8 flex justify-between items-center">
            <h2 style="margin: 0; font-size: 1.5rem;">Forums</h2>
            <button class="btn-primary" id="create-thread-btn">Create Thread</button>
        </div>

        <div class="create-form" id="create-thread-form">
            <h3 style="margin-top: 0; margin-bottom: 1rem;">Create New Thread</h3>
            <form id="new-thread-form">
                <div>
                    <label for="thread-title">Title</label>
                    <input type="text" id="thread-title" required>
                </div>
                <div>
                    <label for="thread-description">Description</label>
                    <textarea id="thread-description" rows="4" required></textarea>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div>
                        <label for="thread-category">Category</label>
                        <select id="thread-category" required>
                            <option value="">Select category...</option>
                            <option value="announcements">Announcements</option>
                            <option value="gaming">Gaming</option>
                            <option value="discussion">Discussion</option>
                            <option value="support">Support</option>
                            <option value="feedback">Feedback</option>
                        </select>
                    </div>
                    <div>
                        <label for="thread-tags">Tags (comma-separated)</label>
                        <input type="text" id="thread-tags">
                    </div>
                </div>
                <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
                    <button type="button" class="btn-secondary" id="cancel-thread-btn">Cancel</button>
                    <button type="submit" class="btn-primary">Post</button>
                </div>
            </form>
        </div>

        <div id="forums-list">
            <div style="text-align:center;padding:2rem;color:var(--color-text-2);">
                <div style="display:inline-block;animation:pulse 2s infinite;">
                    <div style="width:100%;height:100px;background:var(--color-surface-3);border-radius:0.375rem;margin-bottom:1rem;"></div>
                    <div style="width:100%;height:100px;background:var(--color-surface-3);border-radius:0.375rem;margin-bottom:1rem;"></div>
                    <div style="width:100%;height:100px;background:var(--color-surface-3);border-radius:0.375rem;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Messages Tab -->
    <div class="tab-content" id="messages-tab">
        <h2 style="margin-top: 0; margin-bottom: 1rem; font-size: 1.5rem;">Messages</h2>
        <div style="margin-bottom: 1.5rem;">
            <button class="btn-primary" id="create-message-btn">New Message</button>
        </div>

        <div class="create-form" id="create-message-form" style="display:none;">
            <h3 style="margin-top: 0; margin-bottom: 1rem;">Start New Conversation</h3>
            <div style="margin-bottom: 1rem;">
                <label for="recipient-search">Search User (ID, Name, or @DisplayName)</label>
                <input type="text" id="recipient-search" placeholder="Enter user ID, name, or @displayname..." style="width:100%;padding:0.75rem;border:1px solid var(--color-accent);background:var(--color-surface-3);color:var(--color-text);border-radius:0.375rem;font-family:inherit;font-size:0.9rem;margin-bottom:0.5rem;">
                <div id="search-results" style="display:none;max-height:200px;overflow-y:auto;background:var(--color-surface-3);border:1px solid var(--color-accent);border-radius:0.375rem;margin-top:0.5rem;"></div>
            </div>
            <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
                <button type="button" class="btn-secondary" id="cancel-message-btn">Cancel</button>
                <button type="button" class="btn-primary" id="start-conversation-btn" disabled>Start Conversation</button>
            </div>
        </div>

        <div class="dm-container">
            <div class="dm-list" id="dm-list"></div>
            <div class="dm-messages">
                <div class="dm-header" id="dm-header">Select a conversation</div>
                <div class="dm-body" id="dm-body"></div>
                <div class="dm-form" id="dm-form" style="display: none;">
                    <label for="dm-input" style="display:none;"></label>
                    <input type="text" id="dm-input" placeholder="Type a message...">
                    <button class="btn-primary" id="dm-send-btn">Send</button>
                </div>
            </div>
        </div>
    </div>
</main>

<div id="footer-placeholder"></div>

<script type="module" src="./forums-manager.js"></script>
</body>
</html>
